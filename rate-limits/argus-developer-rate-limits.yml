description: >-
  ARGUS Developer publishes no API, and therefore no rate limits, no quota documentation
  and no throttling response headers. This file replaces a 2026-05-04 bulk-sweep scaffold
  that invented free / professional / enterprise limits (10, 100 and 1000 requests per
  minute) and a full X-RateLimit-* header set. None of those values were ever published
  by Altus Group; they have been removed rather than left to be read as provider facts.
