description: >-
  Altus Group publishes a public Trust Center covering the ARGUS product family,
  including ARGUS Developer, which is delivered over the ARGUS Cloud platform. Named
  certifications and audit reports were read verbatim from the Trust Center compliance
  section on 2026-09-06.
trust_center:
  url: https://www.altusgroup.com/trust-center/
  status: 200
  public: true
  owner: Altus Group
  note: >-
    Company-level trust center for Altus Group. ARGUS Developer inherits the ARGUS Cloud
    control environment because the product is delivered over ARGUS Cloud.
certifications:
  - name: SOC 3 Type 2
    scope: ARGUS Cloud
    published: true
    evidence: https://www.altusgroup.com/trust-center/
    note: >-
      ARGUS Developer is delivered over the ARGUS Cloud platform, so this is the report
      that covers this product's hosting environment.
  - name: SOC 3 Type 2
    scope: ARGUS Intelligence Platform
    published: true
    evidence: https://www.altusgroup.com/trust-center/
  - name: SOC 3 Type 2
    scope: Fairways
    published: true
    evidence: https://www.altusgroup.com/trust-center/
  - name: ISO/IEC 27001
    scope: Altus Group (organization-wide)
    published: true
    evidence: https://www.altusgroup.com/trust-center/
  - name: SOC 2 Type II
    scope: Altus Group platforms
    published: false
    availability: on-request
    evidence: https://www.altusgroup.com/trust-center/
    note: >-
      Trust Center states verbatim "please reach out to us to obtain our detailed SOC2
      Type II reports" — the report exists but is not published; it is gated behind a
      request.
